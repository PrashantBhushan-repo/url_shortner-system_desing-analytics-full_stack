server_tokens off;
map $scheme $pburls_hsts {
    https "max-age=86400";
    default "";
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}
resolver 127.0.0.11 valid=10s ipv6=off;
upstream pburls_api {
    zone pburls_api 64k;
    server backend:5000 resolve;
    keepalive 32;
}
# No query strings: OAuth codes and other credentials must not enter access logs.
log_format pburls escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
access_log /dev/stdout pburls;
error_log /dev/stderr warn;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
