root /usr/share/nginx/html;
index index.html;
include /etc/nginx/snippets/pburls-security.conf;
client_max_body_size 2m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
keepalive_timeout 65s;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
# Do not retry non-idempotent requests against a replacement backend.
proxy_next_upstream off;

location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
location = /ready { return 404; }
location = /metrics { return 404; }
location ~ /\. { deny all; }

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/pburls-security.conf;
}
location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/pburls-security.conf;
}
location = /api { return 308 /api/; }
location ~ ^/api/(v1/)?mcp(?:/|$) {
    proxy_pass http://pburls_api;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
location /api/ { proxy_pass http://pburls_api; }
location /r/ {
    proxy_pass http://pburls_api;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/pburls-security.conf;
}
location /socket.io/ {
    proxy_pass http://pburls_api;
    proxy_buffering off;
    proxy_read_timeout 75s;
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/pburls-security.conf;
}
