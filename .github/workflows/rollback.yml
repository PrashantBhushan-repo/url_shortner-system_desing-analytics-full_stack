name: Roll back production application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    concurrency:
      group: pburls-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate rollback target
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: python3 infrastructure/scripts/dispatch.py --rollback --check-config
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - run: python3 infrastructure/scripts/dispatch.py --rollback
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
