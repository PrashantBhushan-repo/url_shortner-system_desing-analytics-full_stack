name: Provision observability dashboards and alerts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-observability
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      OBS_ENVIRONMENT: production
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      GRAFANA_PROMETHEUS_UID: ${{ vars.GRAFANA_PROMETHEUS_UID }}
      GRAFANA_LOKI_UID: ${{ vars.GRAFANA_LOKI_UID }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
      PBURLS_ALERT_THRESHOLDS_JSON: ${{ vars.PBURLS_ALERT_THRESHOLDS_JSON }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check configuration
        run: |
          node --input-type=module <<'JS'
          for (const key of ["GRAFANA_URL", "GRAFANA_PROMETHEUS_UID", "GRAFANA_LOKI_UID", "GRAFANA_TOKEN"]) {
            if (!process.env[key]) throw new Error(`Set production environment configuration: ${key}`);
          }
          JS
      - name: Provision PBUrls dashboards and alert rules
        run: node infrastructure/observability/provision.mjs
