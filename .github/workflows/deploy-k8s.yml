name: Deploy to Kubernetes

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/url_shortner-backend:${{ github.sha }}
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/url_shortner-frontend:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl version --client
      - name: Render deployment manifests
        run: |
          mkdir -p deploy-manifests
          for file in infrastructure/kubernetes/*.yaml; do
            sed -e "s|IMAGE_BACKEND|${BACKEND_IMAGE}|g" \
                -e "s|IMAGE_FRONTEND|${FRONTEND_IMAGE}|g" "$file" > deploy-manifests/$(basename "$file")
          done
      - name: Apply manifests
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f deploy-manifests
