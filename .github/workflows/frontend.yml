name: Frontend validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install frontend and Socket.IO fixture dependencies
        run: |
          npm --prefix frontend ci --include=dev --no-audit --no-fund
          npm --prefix backend ci --include=dev --no-audit --no-fund
      - name: Frontend regression checks
        working-directory: frontend
        run: |
          node --experimental-test-module-mocks --test src/services/*.test.js src/routes/navigation.test.js src/pages/demo/demoData.test.js
          npm run test:socket
      - name: Frontend lint (blocking; no errors or warnings)
        working-directory: frontend
        run: npm run lint -- --max-warnings 0
      - name: Verify frontend production build
        working-directory: frontend
        run: npm run build
