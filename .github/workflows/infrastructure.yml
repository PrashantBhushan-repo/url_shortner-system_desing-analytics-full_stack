name: Infrastructure validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate shell scripts and workflows
        run: |
          for script in infrastructure/scripts/*.sh; do bash -n "$script"; done
          shellcheck -S error infrastructure/scripts/*.sh
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
          python3 -m unittest discover -s infrastructure/tests -p 'test_*.py'
          node --test infrastructure/tests/bootstrap-ghcr.test.mjs
      - name: Verify benchmark runner against a synthetic redirect fixture
        env:
          RUN_K6_SMOKE: 'true'
        run: node --test infrastructure/tests/observability.test.mjs infrastructure/tests/alert-rules.test.mjs
      - name: Save benchmark harness reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-harness
          path: .artifacts/observability/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate observability collector and generated dashboards
        env:
          OTLP_ENDPOINT: http://lgtm:4318
          OTLP_USERNAME: local
          OTLP_PASSWORD: local
          OBS_ENVIRONMENT: test
          OBS_POSTGRES_USER: postgres
          OBS_POSTGRES_PASSWORD: ci_only
          DB_NAME: url_shortener_test
          DOMAIN: ci.company.test
        run: |
          docker run --rm -e OTLP_ENDPOINT -e OTLP_USERNAME -e OTLP_PASSWORD -e OBS_ENVIRONMENT -e OBS_POSTGRES_USER -e OBS_POSTGRES_PASSWORD -e DB_NAME -e DOMAIN -v "$PWD/infrastructure/observability:/etc/alloy:ro" grafana/alloy:v1.21.2 validate /etc/alloy
          node infrastructure/observability/generate-dashboards.mjs
          git diff --exit-code -- infrastructure/observability/grafana/dashboards
      - name: Validate CloudFormation
        run: |
          pipx run cfn-lint infrastructure/aws/stack.yml
