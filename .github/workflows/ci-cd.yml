name: Test, Build and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: url_shortener_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d url_shortener_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      OTEL_SDK_DISABLED: 'true'
      DATABASE_URL: postgresql://postgres:ci_only@127.0.0.1:5432/url_shortener_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret-not-used-outside-disposable-tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm --prefix backend ci --include=dev --no-audit --no-fund
          npm --prefix frontend ci --include=dev --no-audit --no-fund
      - name: Migrate and seed disposable database
        working-directory: backend
        run: |
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
          node prisma/seed.js
      - name: Backend regression and environment checks
        working-directory: backend
        run: |
          npm run test:env
          npm run test:demo
          npm run test:auth
          node --test test/validation.test.mjs
          node --test test/nativeDevelopment.test.mjs
          npm run test:workspace
          npm run test:billing
          npm run test:telemetry
          node test/metrics.test.js
          node --test test/observability.test.mjs
          node --test test/observabilityPostgres.test.mjs
          node --test test/readiness.test.mjs
      - name: Frontend regression checks
        working-directory: frontend
        run: |
          node --experimental-test-module-mocks --test src/services/*.test.js src/routes/navigation.test.js src/pages/demo/demoData.test.js
          npm run test:socket
      - name: Frontend lint (blocking; no errors or warnings)
        working-directory: frontend
        run: npm run lint -- --max-warnings 0
      - name: Validate shell scripts and workflows
        run: |
          for script in infrastructure/scripts/*.sh; do bash -n "$script"; done
          shellcheck -S error infrastructure/scripts/*.sh
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
          python3 -m unittest discover -s infrastructure/tests -p 'test_*.py'
      - name: Verify benchmark runner against a synthetic redirect fixture
        env:
          RUN_K6_SMOKE: 'true'
        run: node --test infrastructure/tests/observability.test.mjs infrastructure/tests/alert-rules.test.mjs
      - name: Save benchmark harness reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-harness
          path: .artifacts/observability/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate observability collector and generated dashboards
        env:
          OTLP_ENDPOINT: http://lgtm:4318
          OTLP_USERNAME: local
          OTLP_PASSWORD: local
          OBS_ENVIRONMENT: test
          OBS_POSTGRES_USER: postgres
          OBS_POSTGRES_PASSWORD: ci_only
          DB_NAME: url_shortener_test
          DOMAIN: ci.company.test
        run: |
          docker run --rm -e OTLP_ENDPOINT -e OTLP_USERNAME -e OTLP_PASSWORD -e OBS_ENVIRONMENT -e OBS_POSTGRES_USER -e OBS_POSTGRES_PASSWORD -e DB_NAME -e DOMAIN -v "$PWD/infrastructure/observability:/etc/alloy:ro" grafana/alloy:v1.21.2 validate /etc/alloy
          node infrastructure/observability/generate-dashboards.mjs
          git diff --exit-code -- infrastructure/observability/grafana/dashboards
      - name: Validate CloudFormation
        run: |
          pipx run cfn-lint infrastructure/aws/stack.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      bundle_image: ${{ steps.bundle-ref.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image namespace
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject existing public packages before publishing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          for kind in backend migration frontend ops; do
            package="${name,,}-$kind"
            visibility=$(gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/$package" --jq .visibility 2>/dev/null || gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package" --jq .visibility 2>/dev/null || true)
            [[ -z "$visibility" || "$visibility" == private ]] || { echo "Existing package $package is public; make it private before publishing"; exit 1; }
          done
      - name: Build backend runtime
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: runtime
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.names.outputs.prefix }}-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
      - name: Build migration tools
        id: migration
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: migration
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.names.outputs.prefix }}-migration:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=migration
          cache-to: type=gha,scope=migration,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
      - name: Build static Nginx frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          target: runtime
          platforms: linux/amd64
          pull: true
          build-args: VITE_API_URL=/api
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.names.outputs.prefix }}-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
      - name: Select exact images
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            {
              echo "BACKEND_IMAGE=$PREFIX-backend:sha-$GITHUB_SHA"
              echo "MIGRATION_IMAGE=$PREFIX-migration:sha-$GITHUB_SHA"
              echo "FRONTEND_IMAGE=$PREFIX-frontend:sha-$GITHUB_SHA"
            } >> "$GITHUB_ENV"
          else
            {
              echo "BACKEND_IMAGE=$PREFIX-backend@$BACKEND_DIGEST"
              echo "MIGRATION_IMAGE=$PREFIX-migration@$MIGRATION_DIGEST"
              echo "FRONTEND_IMAGE=$PREFIX-frontend@$FRONTEND_DIGEST"
            } >> "$GITHUB_ENV"
          fi
      - name: Smoke-test the built images, HTTPS, redirect and worker
        env:
          OBSERVABILITY_SMOKE: 'true'
          BENCHMARK_SMOKE: 'true'
        run: bash infrastructure/scripts/smoke-images.sh "$BACKEND_IMAGE" "$MIGRATION_IMAGE" "$FRONTEND_IMAGE"
      - name: Scan runtime images (blocking high/critical findings with available fixes)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" .artifacts/observability/security
          result=0
          for kind in backend frontend; do
            key="${kind^^}_IMAGE"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$PWD/.artifacts/observability/security:/reports" \
              aquasec/trivy:0.69.3 image --image-src docker --exit-code 1 \
              --severity HIGH,CRITICAL --ignore-unfixed --format json \
              --output "/reports/$kind.json" "${!key}" || result=1
          done
          exit "$result"
      - name: Save application measurements, security reports and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-observability-baseline
          path: .artifacts/observability/
          if-no-files-found: ignore
          retention-days: 14
      - name: Write immutable release manifest
        if: github.event_name != 'pull_request'
        run: |
          printf 'BACKEND_IMAGE=%s\nMIGRATION_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BACKEND_IMAGE" "$MIGRATION_IMAGE" "$FRONTEND_IMAGE" > release.env
          printf 'APP_VERSION=%s\n' "$GITHUB_SHA" >> release.env
          for spec in 'POSTGRES_IMAGE postgres:15-alpine' 'REDIS_IMAGE redis:7.4-alpine' 'CERTBOT_IMAGE certbot/certbot:v5.1.0' 'ALLOY_IMAGE grafana/alloy:v1.21.2'; do
            read -r key image <<< "$spec"
            docker pull --platform linux/amd64 "$image"
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
            printf '%s=%s\n' "$key" "$digest" >> release.env
          done
      - name: Publish deployment bundle (no S3)
        if: github.event_name != 'pull_request'
        id: bundle
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infrastructure/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.prefix }}-ops:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: true
      - name: Ensure every published package is private
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          for kind in backend migration frontend ops; do
            package="${name,,}-$kind"
            visibility=$(gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/$package" --jq .visibility 2>/dev/null || gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package" --jq .visibility)
            [[ "$visibility" == private ]] || { echo "Package $package must be private"; exit 1; }
          done
      - name: Record bundle digest
        if: github.event_name != 'pull_request'
        id: bundle-ref
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          echo "image=$PREFIX-ops@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deployment bundle: $PREFIX-ops@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: release.env
          retention-days: 30

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    concurrency:
      group: pburls-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
      PARAMETER_PREFIX: ${{ vars.PARAMETER_PREFIX || '/pburls/production' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: pburls-github-deploy
      - name: Deploy over Systems Manager and wait for verification
        env:
          BUNDLE_IMAGE: ${{ needs.build.outputs.bundle_image }}
        run: python3 infrastructure/scripts/dispatch.py --sha "$GITHUB_SHA" --image "$BUNDLE_IMAGE"
