name: Test, Build and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Plan affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      infrastructure: ${{ steps.plan.outputs.infrastructure }}
      release: ${{ steps.plan.outputs.release }}
      refresh: ${{ steps.plan.outputs.refresh }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test pipeline planning and deployment helpers
        run: python3 -m unittest discover -s infrastructure/tests -p 'test_*.py'
      - name: Plan from complete Git diff
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infrastructure/scripts/ci-plan.py plan
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml
  infrastructure:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    uses: ./.github/workflows/infrastructure.yml
  build:
    needs: [changes, backend, frontend, infrastructure]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.release == 'true' &&
      (needs.backend.result == 'success' || (needs.changes.outputs.backend == 'false' && needs.backend.result == 'skipped')) &&
      (needs.frontend.result == 'success' || (needs.changes.outputs.frontend == 'false' && needs.frontend.result == 'skipped')) &&
      (needs.infrastructure.result == 'success' || (needs.changes.outputs.infrastructure == 'false' && needs.infrastructure.result == 'skipped'))
    env:
      PUBLISH_IMAGES: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      REFRESH_IMAGES: ${{ needs.changes.outputs.refresh }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_PACKAGE_NAMESPACE: ${{ vars.GHCR_PACKAGE_NAMESPACE }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      bundle_image: ${{ steps.bundle-ref.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (Node.js 24)
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4 (Node.js 24)
        if: env.PUBLISH_IMAGES == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve private source-matched images or request builds
        id: images
        run: python3 infrastructure/scripts/ci-images.py plan
      - name: Build backend runtime
        id: backend
        if: steps.images.outputs.backend_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (Node.js 24)
        with:
          context: backend
          target: runtime
          platforms: linux/amd64
          pull: true
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          load: ${{ env.PUBLISH_IMAGES != 'true' }}
          tags: |
            ${{ steps.images.outputs.prefix }}-backend:sha-${{ github.sha }}
            ${{ steps.images.outputs.backend_source_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: ${{ env.PUBLISH_IMAGES == 'true' }}
          sbom: ${{ env.PUBLISH_IMAGES == 'true' }}
      - name: Build migration tools
        id: migration
        if: steps.images.outputs.migration_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (Node.js 24)
        with:
          context: backend
          target: migration
          pull: true
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          load: ${{ env.PUBLISH_IMAGES != 'true' }}
          tags: |
            ${{ steps.images.outputs.prefix }}-migration:sha-${{ github.sha }}
            ${{ steps.images.outputs.migration_source_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=migration
          cache-to: type=gha,scope=migration,mode=max
          provenance: ${{ env.PUBLISH_IMAGES == 'true' }}
          sbom: ${{ env.PUBLISH_IMAGES == 'true' }}
      - name: Build static Nginx frontend
        id: frontend
        if: steps.images.outputs.frontend_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (Node.js 24)
        with:
          context: frontend
          target: runtime
          platforms: linux/amd64
          pull: true
          build-args: VITE_API_URL=/api
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          load: ${{ env.PUBLISH_IMAGES != 'true' }}
          tags: |
            ${{ steps.images.outputs.prefix }}-frontend:sha-${{ github.sha }}
            ${{ steps.images.outputs.frontend_source_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: ${{ env.PUBLISH_IMAGES == 'true' }}
          sbom: ${{ env.PUBLISH_IMAGES == 'true' }}
      - name: Select exact images
        env:
          PREFIX: ${{ steps.images.outputs.prefix }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest || steps.images.outputs.backend_digest }}
          MIGRATION_DIGEST: ${{ steps.migration.outputs.digest || steps.images.outputs.migration_digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest || steps.images.outputs.frontend_digest }}
        run: |
          if [[ "$PUBLISH_IMAGES" != true ]]; then
            {
              echo "BACKEND_IMAGE=$PREFIX-backend:sha-$GITHUB_SHA"
              echo "MIGRATION_IMAGE=$PREFIX-migration:sha-$GITHUB_SHA"
              echo "FRONTEND_IMAGE=$PREFIX-frontend:sha-$GITHUB_SHA"
            } >> "$GITHUB_ENV"
          else
            {
              echo "BACKEND_IMAGE=$PREFIX-backend@$BACKEND_DIGEST"
              echo "MIGRATION_IMAGE=$PREFIX-migration@$MIGRATION_DIGEST"
              echo "FRONTEND_IMAGE=$PREFIX-frontend@$FRONTEND_DIGEST"
            } >> "$GITHUB_ENV"
          fi
      - name: Smoke-test the built images, HTTPS, redirect and worker
        env:
          OBSERVABILITY_SMOKE: 'true'
          BENCHMARK_SMOKE: 'true'
        run: bash infrastructure/scripts/smoke-images.sh "$BACKEND_IMAGE" "$MIGRATION_IMAGE" "$FRONTEND_IMAGE"
      - name: Scan runtime images (blocking high/critical findings with available fixes)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" .artifacts/observability/security
          result=0
          for kind in backend frontend; do
            key="${kind^^}_IMAGE"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$PWD/.artifacts/observability/security:/reports" \
              aquasec/trivy:0.69.3 image --image-src docker --exit-code 1 \
              --severity HIGH,CRITICAL --ignore-unfixed --format json \
              --output "/reports/$kind.json" "${!key}" || result=1
          done
          exit "$result"
      - name: Save application measurements, security reports and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-observability-baseline
          path: .artifacts/observability/
          if-no-files-found: ignore
          retention-days: 14
      - name: Write immutable release manifest
        if: env.PUBLISH_IMAGES == 'true'
        run: |
          printf 'BACKEND_IMAGE=%s\nMIGRATION_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BACKEND_IMAGE" "$MIGRATION_IMAGE" "$FRONTEND_IMAGE" > release.env
          printf 'APP_VERSION=%s\n' "$GITHUB_SHA" >> release.env
          for spec in 'POSTGRES_IMAGE postgres:15-alpine' 'REDIS_IMAGE redis:7.4-alpine' 'CERTBOT_IMAGE certbot/certbot:v5.1.0' 'ALLOY_IMAGE grafana/alloy:v1.21.2'; do
            read -r key image <<< "$spec"
            docker pull --platform linux/amd64 "$image"
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
            printf '%s=%s\n' "$key" "$digest" >> release.env
          done
      - name: Publish deployment bundle (no S3)
        if: env.PUBLISH_IMAGES == 'true'
        id: bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (Node.js 24)
        with:
          context: .
          file: infrastructure/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.prefix }}-ops:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: true
      - name: Ensure every published package is private
        if: env.PUBLISH_IMAGES == 'true'
        run: python3 infrastructure/scripts/ci-images.py verify
      - name: Record bundle digest
        if: env.PUBLISH_IMAGES == 'true'
        id: bundle-ref
        env:
          PREFIX: ${{ steps.images.outputs.prefix }}
          DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          echo "image=$PREFIX-ops@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deployment bundle: $PREFIX-ops@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH_IMAGES == 'true'
        with:
          name: release-${{ github.sha }}
          path: release.env
          retention-days: 30

  gate:
    name: CI gate
    needs: [changes, backend, frontend, infrastructure, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require every planned job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 infrastructure/scripts/ci-plan.py gate
  deploy:
    name: Deploy verified release
    needs: [changes, build, gate]
    if: always() && !cancelled() && needs.gate.result == 'success' && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'schedule' && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    concurrency:
      group: pburls-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
      PARAMETER_PREFIX: ${{ vars.PARAMETER_PREFIX || '/pburls/production' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Skip a runtime release superseded on main
        id: current
        run: python3 infrastructure/scripts/ci-plan.py deploy
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        if: steps.current.outputs.current == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: pburls-github-deploy
      - name: Deploy exact bundle through Systems Manager and wait for checks
        if: steps.current.outputs.current == 'true'
        env:
          BUNDLE_IMAGE: ${{ needs.build.outputs.bundle_image }}
        run: python3 infrastructure/scripts/dispatch.py --sha "$GITHUB_SHA" --image "$BUNDLE_IMAGE"
