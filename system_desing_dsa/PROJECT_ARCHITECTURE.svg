<text x="1027.5" y="215" class="label" text-anchor="middle"><tspan x="1027.5" dy="0">Redis</tspan><tspan x="1027.5" dy="21">short:code cache</tspan><tspan x="1027.5" dy="21">rate limits / pub-sub</tspan></text>
<path class="store" d="M1290,196 C1290,175 1615,175 1615,196 V264 C1615,285 1290,285 1290,264 Z"/><ellipse class="store" cx="1452.5" cy="196" rx="162.5" ry="16"/>
