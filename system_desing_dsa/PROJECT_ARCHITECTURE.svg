<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1320" viewBox="0 0 1700 1320" role="img" aria-labelledby="title desc">
<title id="title">PBUrls architecture — current implementation</title><desc id="desc">Flowchart of browser and MCP traffic through NGINX and Express into PostgreSQL and Redis, with asynchronous click processing, realtime analytics, billing recovery and telemetry. Production additions are not part of this diagram.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#555261"/></marker><filter id="shadow" x="-10%" y="-15%" width="125%" height="145%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#383044" flood-opacity=".14"/></filter></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#27213b}.label{font-size:16px}.edgeLabel{font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}.lane{font-size:17px;font-weight:600;fill:#5b39a8}.sub{font-size:13px;fill:#6f697c}.service,.client,.store{fill:#f0eaff;stroke:#a27cf4;stroke-width:1.15;filter:url(#shadow)}ellipse.store{filter:none}.external{fill:#f8f6fc;stroke:#b7afc8;stroke-width:1.15}.edge{stroke:#555261;stroke-width:1.4;fill:none}.async{stroke-dasharray:5 4}.rule{stroke:#e5dfef;stroke-width:1}</style><rect width="1700" height="1320" fill="white"/>
<text x="40" y="44" class="lane" text-anchor="start"><tspan x="40" dy="0">PBUrls · URL shortener architecture</tspan></text>
<text x="40" y="71" class="sub" text-anchor="start"><tspan x="40" dy="0">Implemented modules and request flows  /  source snapshot: 23 October 2026</tspan></text>
<text x="1660" y="44" class="sub" text-anchor="end"><tspan x="1660" dy="0">Solid: request / data flow    Dashed: asynchronous event / telemetry</tspan></text>
<line class="rule" x1="35" y1="95" x2="1665" y2="95"/>
<text x="40" y="124" class="lane" text-anchor="start"><tspan x="40" dy="0">01   Entry, routing, and application modules</tspan></text>
<text x="40" y="146" class="sub" text-anchor="start"><tspan x="40" dy="0">The API is one modular Express application. Kubernetes manifests currently declare one API replica.</tspan></text>
<rect class="client" x="45" y="190" width="155" height="64" rx="32"/>
<text x="122.5" y="227" class="label" text-anchor="middle"><tspan x="122.5" dy="0">User / browser</tspan></text>
<rect class="service" x="290" y="180" width="185" height="85" rx="3"/>
<text x="382.5" y="217.5" class="label" text-anchor="middle"><tspan x="382.5" dy="0">NGINX edge /</tspan><tspan x="382.5" dy="21">K8s ingress</tspan></text>
<rect class="service" x="575" y="170" width="230" height="100" rx="3"/>
<text x="690" y="205" class="label" text-anchor="middle"><tspan x="690" dy="0">Express API :5000</tspan><tspan x="690" dy="21">JWT · validation · limits</tspan><tspan x="690" dy="21">ownership · plan gates</tspan></text>
<rect class="service" x="290" y="340" width="185" height="80" rx="3"/>
<text x="382.5" y="375" class="label" text-anchor="middle"><tspan x="382.5" dy="0">React + Vite SPA</tspan><tspan x="382.5" dy="21">served by NGINX</tspan></text>
<rect class="service" x="575" y="325" width="230" height="100" rx="3"/>
<text x="690" y="360" class="label" text-anchor="middle"><tspan x="690" dy="0">Links / QR / identity</tspan><tspan x="690" dy="21">analytics / billing / teams</tspan><tspan x="690" dy="21">domains / keys / admin</tspan></text>
<rect class="client" x="45" y="350" width="155" height="60" rx="30"/>
<text x="122.5" y="385" class="label" text-anchor="middle"><tspan x="122.5" dy="0">MCP client</tspan></text>
