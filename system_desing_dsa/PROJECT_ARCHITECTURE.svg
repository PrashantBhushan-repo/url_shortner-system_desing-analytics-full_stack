<text x="415" y="632.5" class="label" text-anchor="middle"><tspan x="415" dy="0">BullMQ in Redis</tspan><tspan x="415" dy="21">click-queue</tspan></text>
<rect class="service" x="620" y="590" width="245" height="95" rx="3"/>
<text x="742.5" y="622.5" class="label" text-anchor="middle"><tspan x="742.5" dy="0">Click worker</tspan><tspan x="742.5" dy="21">UA / GeoIP / bot checks</tspan><tspan x="742.5" dy="21">concurrency: 5</tspan></text>
<path class="store" d="M990,606 C990,585 1235,585 1235,606 V674 C1235,695 990,695 990,674 Z"/><ellipse class="store" cx="1112.5" cy="606" rx="122.5" ry="16"/>
<text x="1112.5" y="625" class="label" text-anchor="middle"><tspan x="1112.5" dy="0">PostgreSQL</tspan><tspan x="1112.5" dy="21">Click insert</tspan><tspan x="1112.5" dy="21">hourly + daily upserts</tspan></text>
<path class="store" d="M1370,606 C1370,585 1615,585 1615,606 V674 C1615,695 1370,695 1370,674 Z"/><ellipse class="store" cx="1492.5" cy="606" rx="122.5" ry="16"/>
<text x="1492.5" y="625" class="label" text-anchor="middle"><tspan x="1492.5" dy="0">Redis</tspan><tspan x="1492.5" dy="21">daily HLL / minute count</tspan><tspan x="1492.5" dy="21">ws:url:ID publication</tspan></text>
<rect class="service" x="990" y="765" width="245" height="80" rx="3"/>
<text x="1112.5" y="800" class="label" text-anchor="middle"><tspan x="1112.5" dy="0">API Socket.IO</tspan><tspan x="1112.5" dy="21">JWT + authorized URL room</tspan></text>
<rect class="service" x="1370" y="765" width="245" height="80" rx="3"/>
<text x="1492.5" y="800" class="label" text-anchor="middle"><tspan x="1492.5" dy="0">React analytics UI</tspan><tspan x="1492.5" dy="21">click-tick + REST reports</tspan></text>
<rect class="service" x="620" y="765" width="245" height="80" rx="3"/>
