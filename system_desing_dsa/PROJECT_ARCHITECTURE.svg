<line class="rule" x1="35" y1="915" x2="1665" y2="915"/>
<text x="40" y="944" class="lane" text-anchor="start"><tspan x="40" dy="0">03   Billing recovery, scheduled work, and operations</tspan></text>
<text x="40" y="966" class="sub" text-anchor="start"><tspan x="40" dy="0">Billing recovery uses PostgreSQL leases and retries. Click, health, and dunning queues use Redis.</tspan></text>
<rect class="service" x="45" y="1000" width="175" height="80" rx="3"/>
<text x="132.5" y="1035" class="label" text-anchor="middle"><tspan x="132.5" dy="0">Billing REST module</tspan><tspan x="132.5" dy="21">order / verify / refund</tspan></text>
<rect class="external" x="310" y="995" width="210" height="90" rx="3"/>
<text x="415" y="1035" class="label" text-anchor="middle"><tspan x="415" dy="0">Razorpay</tspan><tspan x="415" dy="21">checkout + gateway API</tspan></text>
<path class="store" d="M620,1011 C620,990 865,990 865,1011 V1079 C865,1100 620,1100 620,1079 Z"/><ellipse class="store" cx="742.5" cy="1011" rx="122.5" ry="16"/>
<text x="742.5" y="1030" class="label" text-anchor="middle"><tspan x="742.5" dy="0">PostgreSQL</tspan><tspan x="742.5" dy="21">Payment / WebhookEvent</tspan><tspan x="742.5" dy="21">BillingCheckout / Refund</tspan></text>
<path class="store" d="M990,1011 C990,990 1235,990 1235,1011 V1079 C1235,1100 990,1100 990,1079 Z"/><ellipse class="store" cx="1112.5" cy="1011" rx="122.5" ry="16"/>
<text x="1112.5" y="1030" class="label" text-anchor="middle"><tspan x="1112.5" dy="0">BillingRecoveryJob</tspan><tspan x="1112.5" dy="21">durable queue in Postgres</tspan><tspan x="1112.5" dy="21">leases / retry / review</tspan></text>
<rect class="service" x="1370" y="995" width="245" height="100" rx="3"/>
<text x="1492.5" y="1030" class="label" text-anchor="middle"><tspan x="1492.5" dy="0">Recovery loop</tspan><tspan x="1492.5" dy="21">claim → sync → persist</tspan><tspan x="1492.5" dy="21">runs without Redis</tspan></text>
<rect class="service" x="310" y="1170" width="210" height="75" rx="3"/>
<text x="415" y="1192.5" class="label" text-anchor="middle"><tspan x="415" dy="0">Scheduled workers</tspan><tspan x="415" dy="21">health: every 6 hours</tspan><tspan x="415" dy="21">dunning: daily</tspan></text>
<rect class="service" x="620" y="1170" width="245" height="75" rx="3"/>
