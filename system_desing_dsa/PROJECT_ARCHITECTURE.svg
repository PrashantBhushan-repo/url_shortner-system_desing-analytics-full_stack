<text x="40" y="539" class="lane" text-anchor="start"><tspan x="40" dy="0">02   Redirect and analytics pipeline</tspan></text>
<text x="40" y="561" class="sub" text-anchor="start"><tspan x="40" dy="0">Cache lookup → validate active / expiry / password → 302. Analytics is enqueued without awaiting persistence.</tspan></text>
<rect class="service" x="45" y="595" width="175" height="80" rx="3"/>
<text x="132.5" y="630" class="label" text-anchor="middle"><tspan x="132.5" dy="0">Redirect controller</tspan><tspan x="132.5" dy="21">302 → destination</tspan></text>
