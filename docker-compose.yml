services:
  db:
    image: postgres:15-alpine
    container_name: pburls_db
    restart: always
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prashant1336
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: pburls_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pburls_backend
    restart: always
    ports:
      - "5000:5000"
      - "9464:9464"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:prashant1336@db:5432/url_shortener
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: url_shortener
      DB_USER: postgres
      DB_PASSWORD: prashant1336
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: pburls-backend
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SDK_DISABLED: "false"
      METRICS_PORT: 9464
      DISABLE_CHILD_WORKER: "true"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    command: >
      sh -c "npx prisma migrate deploy && node prisma/seed.js && node prisma/seedAdmin.js && npm start"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pburls_worker
    restart: always
    ports:
      - "9465:9465"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:prashant1336@db:5432/url_shortener
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: url_shortener
      DB_USER: postgres
      DB_PASSWORD: prashant1336
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: pburls-worker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SDK_DISABLED: "false"
      METRICS_PORT: 9465
      IS_CHILD_WORKER: "true"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    command: npm run worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: pburls_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./backend/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"

volumes:
  postgres_data:
  redis_data:
