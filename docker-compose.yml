services:
  db:
    image: postgres:15-alpine
    container_name: pburls_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-url_shortener}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected Compose env file}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: pburls_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: pburls_backend
    restart: always
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-5000}:5000"
    env_file:
      - ${BACKEND_ENV_FILE:-./.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the selected Compose env file}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the selected Compose env file}
      PORT: "5000"
      DB_NAME: ${DB_NAME:-url_shortener}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected Compose env file}
      OTEL_SERVICE_NAME: pburls-backend
      OTEL_SDK_DISABLED: "true"
      METRICS_PORT: 9464
      DISABLE_CHILD_WORKER: "true"
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c 'npx prisma migrate deploy && node prisma/seed.js && if [ -n "$$ADMIN_SEED_EMAIL" ]; then node prisma/seedAdmin.js; fi && npm start'

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: pburls_worker
    restart: always
    env_file:
      - ${BACKEND_ENV_FILE:-./.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the selected Compose env file}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the selected Compose env file}
      OTEL_SERVICE_NAME: pburls-worker
      DB_NAME: ${DB_NAME:-url_shortener}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected Compose env file}
      OTEL_SDK_DISABLED: "true"
      METRICS_PORT: 9465
      IS_CHILD_WORKER: "true"
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: pburls_frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
