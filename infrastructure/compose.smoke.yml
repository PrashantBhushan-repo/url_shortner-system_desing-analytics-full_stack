name: pburls-smoke
x-env: &env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:smoke_only@db:5432/smoke
  REDIS_URL: redis://redis:6379
  JWT_SECRET: smoke-only-secret-with-at-least-thirty-two-characters
  BASE_URL: https://smoke.company.test
  CLIENT_URL: https://smoke.company.test
  TRUST_PROXY: uniquelocal
  OTEL_SDK_DISABLED: "true"
  DISABLE_CHILD_WORKER: "true"
services:
  db:
    image: postgres:15-alpine
    environment: {POSTGRES_PASSWORD: smoke_only, POSTGRES_DB: smoke}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d smoke]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    image: ${MIGRATION_IMAGE:?}
    environment: *env
  backend:
    image: ${BACKEND_IMAGE:?}
    environment: *env
    read_only: true
    tmpfs: [/tmp]
  worker:
    image: ${BACKEND_IMAGE:?}
    command: [node, worker/index.js]
    environment:
      <<: *env
      IS_CHILD_WORKER: "true"
      METRICS_PORT: "9465"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, node, scripts/healthcheck.mjs, --worker]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 30
  frontend:
    image: ${FRONTEND_IMAGE:?}
    ports: ["127.0.0.1:18080:80", "127.0.0.1:18443:443"]
    volumes:
      - ${SMOKE_DIR:?}/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SMOKE_DIR:?}/certificates:/etc/letsencrypt:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
