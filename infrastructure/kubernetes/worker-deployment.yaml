apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pburls
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: IMAGE_BACKEND
          imagePullPolicy: Always
          command: ["npm", "run", "worker"]
          envFrom:
            - configMapRef:
                name: pburls-config
            - secretRef:
                name: pburls-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "pburls-worker"
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "25m"
              memory: "128Mi"
