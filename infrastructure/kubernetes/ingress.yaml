apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snapurl-ingress
  namespace: snapurl
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # To support file uploads or large API requests if needed
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    # Frontend Ingress Rule
    - host: snapurl.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # Backend API Ingress Rule
    - host: api.snapurl.local
      http:
        paths:
          # Match routes starting with /api or redirection URLs
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
