apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pburls
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: query
              containerPort: 16686
          resources:
            limits:
              cpu: "250m"
              memory: "512Mi"
            requests:
              cpu: "50m"
              memory: "256Mi"
