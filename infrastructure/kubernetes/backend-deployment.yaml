apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: snapurl
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: db-migration-and-seed
          # Replace 'your-username' with your container registry path
          image: ghcr.io/your-username/snapurl-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx prisma migrate deploy && node prisma/seed.js && node prisma/seedAdmin.js"]
          envFrom:
            - configMapRef:
                name: snapurl-config
            - secretRef:
                name: snapurl-secrets
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
      containers:
        - name: backend-api
          # Replace 'your-username' with your container registry path
          image: ghcr.io/your-username/snapurl-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: snapurl-config
            - secretRef:
                name: snapurl-secrets
          readinessProbe:
            httpGet:
              path: /health # Assuming there is a health endpoint or we can hit root
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
