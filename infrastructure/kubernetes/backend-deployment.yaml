apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: snapurl
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: db-migration-and-seed
          image: IMAGE_BACKEND
          imagePullPolicy: Always
          command: ["sh", "-c", "npx prisma db push --accept-data-loss && node prisma/seed.js && node prisma/seedAdmin.js"]
          envFrom:
            - configMapRef:
                name: snapurl-config
            - secretRef:
                name: snapurl-secrets
          resources:
            limits:
              cpu: "250m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
      containers:
        - name: backend-api
          image: IMAGE_BACKEND
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: snapurl-config
            - secretRef:
                name: snapurl-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "250m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
